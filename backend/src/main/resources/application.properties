spring.application.name=travel-insurance-platform

# Database Connection (Supabase PostgreSQL)
# Note: DATABASE_URL should be in the format: jdbc:postgresql://<host>:<port>/<db_name>
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Config
# Note: For production/staging development, set this to 'validate' to preserve existing data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT Security Configurations
# JWT_SECRET should be a HS256 key of at least 256 bits (32 bytes)
app.jwt.secret=${JWT_SECRET}
# Token validity: 24 hours (86400000 milliseconds)
app.jwt.expiration-ms=86400000

# Server Config
server.port=8080
