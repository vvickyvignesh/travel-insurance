<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Travel Shield</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="navbar-brand">
            ✈️ Travel<span>Shield</span>
        </a>
        <ul class="nav-links">
            <li><a href="register.html" class="nav-link">Register</a></li>
        </ul>
    </nav>

    <main class="container">
        <div class="auth-wrapper card">
            <h2 style="text-align: center; margin-bottom: 1.5rem;">Access Portal</h2>
            
            <div id="alertContainer"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Login</button>
            </form>

            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                Don't have an account? <a href="register.html" style="color: var(--accent); font-weight: 500;">Register here</a>
            </p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Travel Shield Policy Issuance Platform. All rights reserved.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const alertContainer = document.getElementById('alertContainer');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                alertContainer.innerHTML = '';

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                const response = await api.login({ email, password });

                if (response.success) {
                    auth.saveSession(response.token, response.user);
                    alertContainer.innerHTML = `<div class="alert alert-success">Login successful! Redirecting...</div>`;
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    alertContainer.innerHTML = `<div class="alert alert-danger">${response.message}</div>`;
                }
            });
        });
    </script>
</body>
</html>
