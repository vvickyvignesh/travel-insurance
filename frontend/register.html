<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Travel Shield</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="navbar-brand">
            ✈️ Travel<span>Shield</span>
        </a>
        <ul class="nav-links">
            <li><a href="login.html" class="nav-link">Login</a></li>
        </ul>
    </nav>

    <main class="container">
        <div class="auth-wrapper card">
            <h2 style="text-align: center; margin-bottom: 1.5rem;">Create Account</h2>
            
            <div id="alertContainer"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" class="form-control">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control" required minlength="6">
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Register</button>
            </form>

            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                Already have an account? <a href="login.html" style="color: var(--accent); font-weight: 500;">Login here</a>
            </p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Travel Shield Policy Issuance Platform. All rights reserved.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('registerForm');
            const alertContainer = document.getElementById('alertContainer');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                alertContainer.innerHTML = '';

                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();
                const phone = document.getElementById('phone').value.trim();
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                // Validation
                if (password !== confirmPassword) {
                    alertContainer.innerHTML = `<div class="alert alert-danger">Passwords do not match</div>`;
                    return;
                }

                const response = await api.register({ name, email, phone, password });

                if (response.success) {
                    alertContainer.innerHTML = `<div class="alert alert-success">Registration successful! Redirecting to login...</div>`;
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    alertContainer.innerHTML = `<div class="alert alert-danger">${response.message}</div>`;
                }
            });
        });
    </script>
</body>
</html>
