<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Travel Shield</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/admin.js" defer></script>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="navbar-brand">
            ✈️ Travel<span>Shield</span> 🛡️ Admin
        </a>
        <ul class="nav-links">
            <li><a href="dashboard.html" class="nav-link">My Profile</a></li>
            <li><button id="logoutBtn" class="btn-nav-logout">Logout</button></li>
        </ul>
    </nav>

    <main class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div>
                <h1>Admin Control Panel</h1>
                <p style="color: var(--text-muted);">Manage platform users and view access roles.</p>
            </div>
            <div class="card" style="padding: 1rem 2rem; display: flex; flex-direction: column; align-items: center; gap: 0.25rem;">
                <span style="font-size: 1.5rem; font-weight: bold; color: var(--accent);" id="totalUsers">0</span>
                <span style="font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; font-weight: bold;">Total Users</span>
            </div>
        </div>

        <div id="alertContainer"></div>

        <div class="card">
            <h2>Registered Platform Users</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>User ID</th>
                            <th>Name</th>
                            <th>Email Address</th>
                            <th>Phone Number</th>
                            <th>Role</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr>
                            <td colspan="5" style="text-align: center; color: var(--text-muted);">Loading users list...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Travel Shield Policy Issuance Platform. All rights reserved.</p>
    </footer>

</body>
</html>
